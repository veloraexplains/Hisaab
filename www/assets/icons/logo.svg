<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B6B3A"/>
      <stop offset="100%" stop-color="#054D28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Gold bar chart (top center) -->
  <rect x="205" y="130" width="22" height="60" rx="5" fill="url(#goldGrad)"/>
  <rect x="235" y="95" width="22" height="95" rx="5" fill="url(#goldGrad)"/>
  <rect x="265" y="105" width="22" height="85" rx="5" fill="url(#goldGrad)"/>
  <rect x="295" y="130" width="22" height="60" rx="5" fill="url(#goldGrad)"/>

  <!-- Open book - left page -->
  <path d="M100 200 L100 380 Q140 360 220 360 L240 360 L240 190 Q160 200 120 190 Z" 
        fill="#FFFFFF" stroke="#0B6B3A" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Open book - right page -->
  <path d="M412 200 L412 380 Q372 360 292 360 L272 360 L272 190 Q352 200 392 190 Z" 
        fill="#FFFFFF" stroke="#0B6B3A" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Book spine (center fold) -->
  <path d="M240 190 L256 210 L272 190 L272 360 L256 380 L240 360 Z" 
        fill="#E5E7EB" stroke="#0B6B3A" stroke-width="4"/>

  <!-- Left page - bullet dots + lines -->
  <circle cx="130" cy="230" r="6" fill="#0B6B3A"/>
  <line x1="150" y1="230" x2="215" y2="230" stroke="#0B6B3A" stroke-width="6" stroke-linecap="round"/>
  
  <circle cx="130" cy="255" r="6" fill="#0B6B3A"/>
  <line x1="150" y1="255" x2="215" y2="255" stroke="#0B6B3A" stroke-width="6" stroke-linecap="round"/>
  
  <circle cx="130" cy="280" r="6" fill="#0B6B3A"/>
  <line x1="150" y1="280" x2="215" y2="280" stroke="#0B6B3A" stroke-width="6" stroke-linecap="round"/>
  
  <circle cx="130" cy="305" r="6" fill="#0B6B3A"/>
  <line x1="150" y1="305" x2="195" y2="305" stroke="#0B6B3A" stroke-width="6" stroke-linecap="round"/>

  <!-- Right page - big ₹ symbol -->
  <text x="330" y="330" font-family="Arial, sans-serif" font-size="120" font-weight="900" 
        fill="#0B6B3A" text-anchor="middle">₹</text>

  <!-- Pencil (diagonal, top-right) -->
  <g transform="rotate(35 380 280)">
    <!-- Pencil body -->
    <rect x="365" y="140" width="30" height="180" rx="6" fill="#22C55E"/>
    <!-- Pencil metallic band -->
    <rect x="365" y="140" width="30" height="30" rx="4" fill="#E5E7EB"/>
    <!-- Pencil tip -->
    <polygon points="365,320 395,320 380,360" fill="#FCD34D"/>
    <polygon points="375,340 385,340 380,360" fill="#1F2937"/>
    <!-- Pencil eraser -->
    <rect x="365" y="115" width="30" height="25" rx="6" fill="#F87171"/>
  </g>

  <!-- Book spine accent (bottom) -->
  <path d="M240 360 Q248 375 256 375 Q264 375 272 360" 
        fill="none" stroke="#0B6B3A" stroke-width="6" stroke-linecap="round"/>
</svg>
