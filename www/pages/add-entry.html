<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Add Entry - Hisaab</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.entry-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
}
.entry-block.gave { border-left: 4px solid #EF4444; }
.entry-block.got { border-left: 4px solid #22C55E; }

.block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.block-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 800;
}
.block-title.gave { color: #EF4444; }
.block-title.got { color: #22C55E; }
.block-icon { font-size: 20px; }

.block-optional {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.amount-wrap {
  position: relative;
}
.amount-input {
  width: 100%;
  padding: 16px 16px 16px 48px;
  background: var(--bg-elevated);
  border: 2px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  font-size: 22px;
  font-weight: 800;
  outline: none;
  font-variant-numeric: tabular-nums;
}
.amount-input:focus { border-color: var(--primary); }
.amount-prefix {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  font-weight: 800;
  color: var(--muted);
}

.items-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--bg-elevated);
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
}
.items-toggle-arrow {
  font-size: 14px;
  transition: transform 0.2s;
}
.items-toggle.open .items-toggle-arrow {
  transform: rotate(180deg);
}
.items-section {
  display: none;
  margin-top: 10px;
}
.items-section.open { display: block; }

.item-row {
  background: var(--bg-elevated);
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.item-row-top { display: flex; gap: 6px; align-items: center; }
.item-row-num {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.item-row input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.item-row input:focus { border-color: var(--primary); }
.item-row-bot { display: flex; gap: 6px; }
.item-qty { flex: 1; }
.item-price { flex: 1; }
.item-delete {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(239,68,68,0.15); color: #EF4444;
  border: none; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer;
}
.add-item-btn {
  width: 100%; padding: 10px;
  background: transparent;
  border: 2px dashed var(--border);
  border-radius: 10px;
  color: var(--primary);
  font-size: 12px; font-weight: 700;
  cursor: pointer;
}
.items-total {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  padding: 8px 12px;
  background: var(--bg-elevated);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
}
.items-total-amt { font-weight: 900; color: var(--primary); }

.payment-modes {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 12px;
}
.pay-mode {
  background: var(--bg-elevated);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 700;
}
.pay-mode .pay-icon { font-size: 18px; }
.pay-mode.active {
  background: rgba(34,197,94,0.15);
  border-color: #22C55E;
  color: #22C55E;
}

.net-card {
  background: linear-gradient(135deg, #1A2921 0%, #0F1A14 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
}
.net-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
}
.net-amount {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -1px;
  color: var(--text);
}
.net-hint {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
}
</style>
</head>
<body class="app-body">

<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" onclick="Router.back()">←</button>
    <h1 class="brand" id="headerName">Add Entry</h1>
  </div>
</header>

<main class="content">

  <!-- YOU GAVE BLOCK -->
  <div class="entry-block gave">
    <div class="block-header">
      <div class="block-title gave">
        <span class="block-icon">↗</span>
        <span>You Gave</span>
      </div>
      <span class="block-optional">Optional</span>
    </div>
    <div class="amount-wrap">
      <span class="amount-prefix">₹</span>
      <input type="tel" class="amount-input" id="gaveInput" placeholder="0" inputmode="decimal">
    </div>
    <div class="items-toggle" id="itemsToggle" onclick="toggleItems()">
      <span>🍬 Add Item Details</span>
      <span class="items-toggle-arrow">▼</span>
    </div>
    <div class="items-section" id="itemsSection">
      <div id="itemsList"></div>
      <button class="add-item-btn" onclick="addItem()">+ Add Another Item</button>
      <div class="items-total">
        <span>Items Total</span>
        <span class="items-total-amt" id="itemsTotal">₹0</span>
      </div>
    </div>
  </div>

  <!-- YOU GOT BLOCK -->
  <div class="entry-block got">
    <div class="block-header">
      <div class="block-title got">
        <span class="block-icon">↙</span>
        <span>You Got</span>
      </div>
      <span class="block-optional">Optional</span>
    </div>
    <div class="amount-wrap">
      <span class="amount-prefix">₹</span>
      <input type="tel" class="amount-input" id="gotInput" placeholder="0" inputmode="decimal">
    </div>
    <div class="payment-modes">
      <div class="pay-mode active" data-mode="cash" onclick="pickPayMode('cash')">
        <span class="pay-icon">💵</span><span>Cash</span>
      </div>
      <div class="pay-mode" data-mode="upi" onclick="pickPayMode('upi')">
        <span class="pay-icon">📱</span><span>UPI</span>
      </div>
      <div class="pay-mode" data-mode="bank" onclick="pickPayMode('bank')">
        <span class="pay-icon">🏦</span><span>Bank</span>
      </div>
      <div class="pay-mode" data-mode="cheque" onclick="pickPayMode('cheque')">
        <span class="pay-icon">📝</span><span>Cheque</span>
      </div>
    </div>
  </div>

  <!-- NET EFFECT -->
  <div class="net-card">
    <div class="net-label">Net Effect on Balance</div>
    <div class="net-amount" id="netAmount">₹0</div>
    <div class="net-hint" id="netHint">Enter amounts above</div>
  </div>

  <!-- NOTE -->
  <div class="field">
    <label class="field-label">Note (optional)</label>
    <input type="text" id="noteInput" class="input" placeholder="e.g. 10 items, monthly" maxlength="100">
  </div>

  <!-- DATE -->
  <div class="field">
    <label class="field-label">Date</label>
    <div class="date-quick-row">
      <button class="date-chip active" onclick="pickDate(0)" data-days="0">Today</button>
      <button class="date-chip" onclick="pickDate(1)" data-days="1">Yesterday</button>
      <button class="date-chip" onclick="pickDate(2)" data-days="2">2 days ago</button>
      <button class="date-chip" onclick="pickDate(7)" data-days="7">1 week</button>
    </div>
    <input type="date" id="dateInput" class="input mt-sm">
  </div>

  <button class="btn btn-primary btn-full mt-lg" id="saveBtn">💾 Save Entry</button>

</main>

<script src="../js/services/storage.js"></script>
<script src="../js/data/strings.js"></script>
<script src="../js/data/strings-i18n.js"></script>
<script src="../js/services/i18n.js"></script>
<script src="../js/router.js"></script>
<script src="../js/services/notify.js"></script>
<script src="../js/services/pdf.js"></script>
<script src="../js/services/qr.js"></script>
<script src="../js/lib/jspdf.min.js"></script>
<script src="../js/ui/add-entry.js"></script>
</body>
</html>
