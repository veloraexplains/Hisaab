<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Set PIN - Hisaab</title>
<link rel="stylesheet" href="../css/style.css">
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #0F1A14; overflow: hidden; }
.pin-setup {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 60px 20px 40px;
  background: #0F1A14;
}
.pin-top { text-align: center; padding-top: 20px; }
.pin-icon-wrap {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, #22C55E 0%, #15803D 100%);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.3);
}
.pin-icon-wrap svg { width: 36px; height: 36px; }
.pin-heading {
  font-size: 24px; font-weight: 900; color: #fff;
  letter-spacing: -0.5px; margin-bottom: 8px;
}
.pin-sub {
  font-size: 14px; color: #9CA3AF; line-height: 1.5;
  padding: 0 20px;
}
.pin-sub.error { color: #EF4444; animation: shake 0.4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.pin-dots { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
.pin-dot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2.5px solid #2A3B32; background: transparent;
  transition: all 0.15s;
}
.pin-dot.filled {
  background: #22C55E; border-color: #22C55E; transform: scale(1.15);
}

.pin-pad-wrap { width: 100%; max-width: 340px; }
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 16px;
}
.pin-key {
  aspect-ratio: 1;
  background: #1A2921;
  border: 1.5px solid #2A3B32;
  border-radius: 50%;
  color: #FFFFFF;
  font-size: 26px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.1s; user-select: none; padding: 0;
  font-family: inherit;
}
.pin-key:active {
  background: #22C55E; border-color: #22C55E; transform: scale(0.95);
}
.pin-key.empty { visibility: hidden; pointer-events: none; }
.pin-key.delete svg { width: 28px; height: 28px; }

.pin-cancel {
  width: 100%; max-width: 340px;
  padding: 14px;
  background: transparent;
  border: none;
  color: #9CA3AF;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}
</style>
</head>
<body>

<div class="pin-setup">

  <div class="pin-top">
    <div class="pin-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div class="pin-heading" id="pinHeading">Set PIN</div>
    <div class="pin-sub" id="pinSub">Create a 4-digit PIN to protect your khata</div>
    <div class="pin-dots">
      <div class="pin-dot" data-slot="1"></div>
      <div class="pin-dot" data-slot="2"></div>
      <div class="pin-dot" data-slot="3"></div>
      <div class="pin-dot" data-slot="4"></div>
    </div>
  </div>

  <div class="pin-pad-wrap">
    <div class="pin-pad">
      <button class="pin-key" data-key="1">1</button>
      <button class="pin-key" data-key="2">2</button>
      <button class="pin-key" data-key="3">3</button>
      <button class="pin-key" data-key="4">4</button>
      <button class="pin-key" data-key="5">5</button>
      <button class="pin-key" data-key="6">6</button>
      <button class="pin-key" data-key="7">7</button>
      <button class="pin-key" data-key="8">8</button>
      <button class="pin-key" data-key="9">9</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" data-key="0">0</button>
      <button class="pin-key delete" data-key="del">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
          <line x1="18" y1="9" x2="12" y2="15"/>
          <line x1="12" y1="9" x2="18" y2="15"/>
        </svg>
      </button>
    </div>
    <button class="pin-cancel" onclick="cancelSetup()">Cancel</button>
  </div>

</div>

<script src="../js/services/storage.js"></script>
<script src="../js/router.js"></script>
<script>
var entered = '';
var stage = 1;      // 1 = entering PIN, 2 = confirming PIN
var firstPin = '';

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.pin-key').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = btn.dataset.key;
      if (!key) return;
      
      if (key === 'del') {
        if (entered.length > 0) entered = entered.slice(0, -1);
      } else if (entered.length < 4) {
        entered += key;
      }
      
      renderDots();
      
      if (entered.length === 4) {
        setTimeout(handleFour, 180);
      }
    });
  });
});

function renderDots() {
  document.querySelectorAll('.pin-dot').forEach(function(dot, i) {
    dot.classList.toggle('filled', i < entered.length);
  });
}

function handleFour() {
  if (stage === 1) {
    firstPin = entered;
    entered = '';
    stage = 2;
    document.getElementById('pinHeading').textContent = 'Confirm PIN';
    document.getElementById('pinSub').textContent = 'Enter the same 4-digit PIN again';
    document.getElementById('pinSub').classList.remove('error');
    renderDots();
  } else {
    if (entered === firstPin) {
      // Save PIN
      Storage.setPin(entered);
      if (navigator.vibrate) navigator.vibrate(30);
      
      document.getElementById('pinSub').textContent = '✅ PIN set successfully';
      document.getElementById('pinSub').classList.remove('error');
      
      setTimeout(function() {
        Router.go('settings');
      }, 800);
    } else {
      // Wrong — reset
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      document.getElementById('pinSub').textContent = 'PINs do not match. Try again.';
      document.getElementById('pinSub').classList.add('error');
      
      setTimeout(function() {
        entered = '';
        firstPin = '';
        stage = 1;
        document.getElementById('pinHeading').textContent = 'Set PIN';
        document.getElementById('pinSub').textContent = 'Create a 4-digit PIN to protect your khata';
        document.getElementById('pinSub').classList.remove('error');
        renderDots();
      }, 1200);
    }
  }
}

function cancelSetup() {
  Router.go('settings');
}
</script>
</body>
</html>
