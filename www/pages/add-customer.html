<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Add Customer - Hisaab</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-body">

<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" onclick="Router.back()">←</button>
    <h1 class="brand" data-i18n="add_customer">Add Customer</h1>
  </div>
</header>

<main class="content">

  <div class="field">
    <label class="field-label" data-i18n="name">Name</label>
    <input type="text" id="nameInput" class="input" placeholder="e.g. Ramesh Kumar" maxlength="50" autofocus>
    <div class="field-error hidden" id="nameError"></div>
  </div>

  <div class="field">
    <label class="field-label" data-i18n="phone_optional">Phone (optional)</label>
    <input type="tel" id="phoneInput" class="input" placeholder="9876543210" maxlength="10" inputmode="numeric">
    <div class="field-error hidden" id="phoneError"></div>
  </div>

  <button class="btn btn-primary btn-full mt-lg" id="saveBtn" data-i18n="save">Save</button>

</main>

<script src="../js/services/storage.js"></script>
<script src="../js/data/strings.js"></script>
<script src="../js/data/strings-i18n.js"></script>
<script src="../js/services/i18n.js"></script>
<script src="../js/router.js"></script>
<script src="../js/services/notify.js"></script>
<script src="../js/ui/add.js"></script>
</body>
</html>
