<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Customer - Hisaab</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-body">

<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" onclick="Router.home()">←</button>
    <h1 class="brand" id="customerName">Customer</h1>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="generatePDF()" title="Save PDF">📄</button>
    <button class="icon-btn" onclick="sharePDF()" title="Share PDF">📤</button>
    <button class="icon-btn" id="callBtn" onclick="callCustomer()">📞</button>
    <button class="icon-btn" id="waBtn" onclick="sendWhatsApp()">💬</button>
    <button class="icon-btn" onclick="confirmDelete()">🗑️</button>
  </div>
</header>

<main class="content">

  <div class="balance-card" id="balanceCard">
    <div class="balance-label" id="balanceLabel">Pending</div>
    <div class="balance-amount" id="balanceAmount">₹0</div>
    <div class="balance-sub" id="balanceSub"></div>
  </div>

  <h3 class="section-title mt-lg">Payment History</h3>
  <div class="chart-container" id="paymentChart">
    <p class="text-muted text-center" style="padding:20px">Loading chart...</p>
  </div>

  <h3 class="section-title mt-lg">Ledger</h3>
  <div id="entryList"></div>

</main>

<button class="fab" onclick="addEntry()">+</button>

<script src="../js/lib/jspdf.min.js"></script>
<script src="../js/lib/qrcode.min.js"></script>
<script src="../js/services/storage.js"></script>
<script src="../js/data/strings.js"></script>
<script src="../js/data/strings-i18n.js"></script>
<script src="../js/services/i18n.js"></script>
<script src="../js/router.js"></script>
<script src="../js/services/notify.js"></script>
<script src="../js/services/whatsapp.js"></script>
<script src="../js/services/upi.js"></script>
<script src="../js/services/qr.js"></script>
<script src="../js/services/pdf.js"></script>
<script src="../js/ui/customer.js"></script>
</body>
</html>
